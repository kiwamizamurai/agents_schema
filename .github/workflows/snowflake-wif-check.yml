name: Snowflake WIF check

on:
  push:
    branches: [wif-check]

jobs:
  main:
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    env:
      WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
      WIF_JOB: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install .
      - run: python .github/wif-check/run.py

  no-permission:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
      WIF_JOB: no-permission
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install .
      - run: python .github/wif-check/run.py

  bad-subject:
    runs-on: ubuntu-latest
    environment: wif-bad-subject
    permissions: {contents: read, id-token: write}
    env:
      WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
      WIF_JOB: bad-subject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install .
      - run: python .github/wif-check/run.py
